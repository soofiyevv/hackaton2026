name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install python-dotenv pytest
      - name: Offline tests (no API keys needed)
        env:
          UNIRESOLVE_MODE: offline
        run: python -m pytest -q
